<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLS 微信群足球联赛管理系统</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html2canvas for poster generation -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #030712; color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0b0f19; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ----------------------------------------------------------------------------------
    // ☁️ Supabase 全局内置配置（已填入你的 Supabase URL 和 Key，上传 GitHub 后全群永久自动连接！）
    // ----------------------------------------------------------------------------------
    const DEFAULT_SUPABASE_URL = "https://msjfjtwxondxbbslhqok.supabase.co";
    const DEFAULT_SUPABASE_ANON_KEY = "sb_publishable_h2bId_aXPZzv0ArWq3VYCw_bnKT4rSl";

    const DEFAULT_ADMIN_PIN = "0727";
    const GROUPS = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M", "N", "O", "P"];

    const DLS_TEAMS = [
      "皇家马德里", "曼城", "拜仁慕尼黑", "巴黎圣日耳曼", "巴塞罗那", "阿森纳", "国际米兰", "利物浦",
      "尤文图斯", "AC米兰", "马德里竞技", "多特蒙德", "勒沃库森", "切尔西", "曼联", "热刺"
    ];

    // 复制剪贴板通用工具函数（兼容微信浏览器与标准 Web 环境）
    const copyToClipboard = (text, successCallback) => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          if (successCallback) successCallback();
        }).catch(() => {
          fallbackCopyText(text, successCallback);
        });
      } else {
        fallbackCopyText(text, successCallback);
      }
    };

    const fallbackCopyText = (text, successCallback) => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        if (successCallback) successCallback();
      } catch (err) {
        console.error('复制失败', err);
      }
      document.body.removeChild(textArea);
    };

    // 生成淘汰赛树状结构 (32强 -> 16强 -> 8强 -> 半决赛 -> 季军赛/总决赛)
    const generateKnockoutStructure = () => {
      const r32 = [];
      for (let i = 1; i <= 16; i++) {
        const g1 = GROUPS[(i - 1) % 16];
        const g2 = GROUPS[i % 16];
        r32.push({
          id: `R32-${i.toString().padStart(2, '0')}`,
          round: '32_strong',
          title: `32强 第${i}组`,
          half: i <= 8 ? 'upper' : 'lower',
          format: 'two_legs',
          p1_source: `${g1}1`,
          p2_source: `${g2}2`,
          p1_id: null,
          p2_id: null,
          leg1: { p1: null, p2: null, status: 'pending' },
          leg2: { p1: null, p2: null, status: 'pending' },
          leg3: { p1: null, p2: null, status: 'pending', penalty_winner: null },
          winner_id: null,
          pending_score: null,
          status: 'pending'
        });
      }

      const r16 = Array.from({ length: 8 }, (_, i) => ({
        id: `R16-${(i + 1).toString().padStart(2, '0')}`,
        round: '16_strong',
        title: `16强 第${i + 1}组`,
        half: i < 4 ? 'upper' : 'lower',
        format: 'two_legs',
        p1_id: null,
        p2_id: null,
        leg1: { p1: null, p2: null, status: 'pending' },
        leg2: { p1: null, p2: null, status: 'pending' },
        leg3: { p1: null, p2: null, status: 'pending', penalty_winner: null },
        winner_id: null,
        pending_score: null,
        status: 'pending'
      }));

      const r8 = Array.from({ length: 4 }, (_, i) => ({
        id: `R8-${(i + 1).toString().padStart(2, '0')}`,
        round: '8_strong',
        title: `8强 第${i + 1}组`,
        half: i < 2 ? 'upper' : 'lower',
        format: 'two_legs',
        p1_id: null,
        p2_id: null,
        leg1: { p1: null, p2: null, status: 'pending' },
        leg2: { p1: null, p2: null, status: 'pending' },
        leg3: { p1: null, p2: null, status: 'pending', penalty_winner: null },
        winner_id: null,
        pending_score: null,
        status: 'pending'
      }));

      const r4 = Array.from({ length: 2 }, (_, i) => ({
        id: `R4-${(i + 1).toString().padStart(2, '0')}`,
        round: 'semi_final',
        title: i === 0 ? '上半区半决赛' : '下半区半决赛',
        half: i === 0 ? 'upper' : 'lower',
        format: 'two_legs',
        p1_id: null,
        p2_id: null,
        leg1: { p1: null, p2: null, status: 'pending' },
        leg2: { p1: null, p2: null, status: 'pending' },
        leg3: { p1: null, p2: null, status: 'pending', penalty_winner: null },
        winner_id: null,
        pending_score: null,
        status: 'pending'
      }));

      const thirdPlace = {
        id: 'R3RD-01',
        round: 'third_place',
        title: '🥉 季军争夺战 (Bo3)',
        format: 'bo3',
        p1_id: null,
        p2_id: null,
        games: [
          { game: 1, p1: null, p2: null, status: 'pending' },
          { game: 2, p1: null, p2: null, status: 'pending' },
          { game: 3, p1: null, p2: null, status: 'pending' }
        ],
        winner_id: null,
        pending_score: null,
        status: 'pending'
      };

      const grandFinal = {
        id: 'RFINAL-01',
        round: 'final',
        title: '🏆 终极总决赛 (Bo5)',
        format: 'bo5',
        p1_id: null,
        p2_id: null,
        games: [
          { game: 1, p1: null, p2: null, status: 'pending' },
          { game: 2, p1: null, p2: null, status: 'pending' },
          { game: 3, p1: null, p2: null, status: 'pending' },
          { game: 4, p1: null, p2: null, status: 'pending' },
          { game: 5, p1: null, p2: null, status: 'pending' }
        ],
        winner_id: null,
        pending_score: null,
        status: 'pending'
      };

      return [...r32, ...r16, ...r8, ...r4, thirdPlace, grandFinal];
    };

    const generateBlankData = (customPlayerList = null, title = "DLS 微信群欧冠级足球联赛") => {
      const players = [];
      
      if (customPlayerList && customPlayerList.length > 0) {
        customPlayerList.forEach((p, idx) => {
          const pin = (1000 + (idx + 1) * 137) % 9000 + 1000;
          const groupIndex = idx % 16;
          players.push({
            id: `P${(idx + 1).toString().padStart(2, '0')}`,
            name: p.name || `选手 ${idx + 1}`,
            team: p.team || DLS_TEAMS[idx % DLS_TEAMS.length],
            group: GROUPS[groupIndex],
            pin: pin.toString()
          });
        });
      } else {
        for (let i = 1; i <= 64; i++) {
          const pin = (1000 + i * 137) % 9000 + 1000;
          const groupIndex = (i - 1) % 16;
          const teamIndex = (i - 1) % DLS_TEAMS.length;
          players.push({
            id: `P${i.toString().padStart(2, '0')}`,
            name: `选手 ${i}`,
            team: DLS_TEAMS[teamIndex],
            group: GROUPS[groupIndex],
            pin: pin.toString()
          });
        }
      }

      const activeGroups = Array.from(new Set(players.map(p => p.group)));
      const groupMatches = [];
      activeGroups.forEach(g => {
        const groupPlayers = players.filter(p => p.group === g);
        let matchIdx = 1;
        for (let i = 0; i < groupPlayers.length; i++) {
          for (let j = i + 1; j < groupPlayers.length; j++) {
            groupMatches.push({
              id: `G-${g}-${matchIdx++}`,
              group: g,
              p1_id: groupPlayers[i].id,
              p2_id: groupPlayers[j].id,
              p1_score: null,
              p2_score: null,
              pending_score: null,
              status: 'pending'
            });
          }
        }
      });

      const knockoutMatches = generateKnockoutStructure();

      return {
        title: title,
        playerCount: players.length,
        adminPin: DEFAULT_ADMIN_PIN,
        supabaseUrl: DEFAULT_SUPABASE_URL,
        supabaseAnonKey: DEFAULT_SUPABASE_ANON_KEY,
        players,
        groupMatches,
        knockoutMatches,
        predictions: {}
      };
    };

    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('dls_tournament_data_v6');
        const initial = saved ? JSON.parse(saved) : generateBlankData();
        initial.supabaseUrl = DEFAULT_SUPABASE_URL;
        initial.supabaseAnonKey = DEFAULT_SUPABASE_ANON_KEY;
        return initial;
      });

      const [userVotes, setUserVotes] = useState(() => {
        const savedVotes = localStorage.getItem('dls_user_votes_v6');
        return savedVotes ? JSON.parse(savedVotes) : {};
      });

      const [activeTab, setActiveTab] = useState('matches');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMatch, setSelectedMatch] = useState(null);
      const [modalType, setModalType] = useState(null); // 'score' | 'share' | 'admin' | 'tree'
      const [adminLoggedIn, setAdminLoggedIn] = useState(false);
      const [posterImage, setPosterImage] = useState(null);
      const [toast, setToast] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('offline'); // 'offline' | 'connected' | 'syncing'

      const supabaseRef = useRef(null);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const cleanSupabaseUrl = (url) => {
        if (!url) return '';
        return url.replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
      };

      useEffect(() => {
        const rawUrl = data.supabaseUrl || DEFAULT_SUPABASE_URL;
        const url = cleanSupabaseUrl(rawUrl);
        const key = data.supabaseAnonKey || DEFAULT_SUPABASE_ANON_KEY;

        if (!url || !key || !window.supabase) {
          setCloudStatus('offline');
          return;
        }

        let isMounted = true;
        let pollingInterval = null;
        let channel = null;

        try {
          const client = window.supabase.createClient(url, key);
          supabaseRef.current = client;

          const fetchLatestData = () => {
            client.from('tournament_data').select('data').eq('id', 'main_tournament').single()
              .then(({ data: res, error }) => {
                if (!isMounted) return;
                if (res && res.data) {
                  setData(res.data);
                  setCloudStatus('connected');
                } else if (!error) {
                  client.from('tournament_data').upsert({ id: 'main_tournament', data: data })
                    .then(() => { if (isMounted) setCloudStatus('connected'); });
                }
              })
              .catch(() => {
                if (isMounted) setCloudStatus('offline');
              });
          };

          fetchLatestData();

          try {
            channel = client.channel('public:tournament_data')
              .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tournament_data', filter: 'id=eq.main_tournament' }, (payload) => {
                if (isMounted && payload.new && payload.new.data) {
                  setData(payload.new.data);
                  setCloudStatus('connected');
                }
              })
              .subscribe((status) => {
                if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                  if (!pollingInterval) {
                    pollingInterval = setInterval(fetchLatestData, 4000);
                  }
                }
              });
          } catch (wsErr) {
            pollingInterval = setInterval(fetchLatestData, 4000);
          }
        } catch (e) {
          console.warn('Supabase 初始化提示:', e);
          setCloudStatus('offline');
        }

        return () => {
          isMounted = false;
          if (pollingInterval) clearInterval(pollingInterval);
          if (channel && supabaseRef.current) {
            try { supabaseRef.current.removeChannel(channel); } catch (err) {}
          }
        };
      }, [data.supabaseUrl, data.supabaseAnonKey]);

      const saveState = (newData) => {
        setData(newData);
        localStorage.setItem('dls_tournament_data_v6', JSON.stringify(newData));

        if (supabaseRef.current) {
          setCloudStatus('syncing');
          supabaseRef.current.from('tournament_data').upsert({ id: 'main_tournament', data: newData })
            .then(({ error }) => {
              if (!error) setCloudStatus('connected');
              else setCloudStatus('offline');
            });
        }
      };

      useEffect(() => {
        localStorage.setItem('dls_user_votes_v6', JSON.stringify(userVotes));
      }, [userVotes]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const playerMap = useMemo(() => {
        const map = {};
        (data.players || []).forEach(p => { map[p.id] = p; });
        return map;
      }, [data.players]);

      const groupStandings = useMemo(() => {
        const standings = {};
        GROUPS.forEach(g => {
          const groupPlayers = (data.players || []).filter(p => p.group === g);
          standings[g] = groupPlayers.map(p => ({
            ...p,
            played: 0,
            won: 0,
            drawn: 0,
            lost: 0,
            ptsFor: 0,
            ptsAgainst: 0,
            diff: 0,
            points: 0
          }));
        });

        (data.groupMatches || []).forEach(m => {
          if (m.status === 'completed' && m.p1_score !== null && m.p2_score !== null) {
            const g = m.group;
            const p1 = standings[g]?.find(p => p.id === m.p1_id);
            const p2 = standings[g]?.find(p => p.id === m.p2_id);

            if (p1 && p2) {
              p1.played += 1;
              p2.played += 1;
              p1.ptsFor += m.p1_score;
              p1.ptsAgainst += m.p2_score;
              p2.ptsFor += m.p2_score;
              p2.ptsAgainst += m.p1_score;

              if (m.p1_score > m.p2_score) {
                p1.won += 1;
                p1.points += 3;
                p2.lost += 1;
              } else if (m.p2_score > m.p1_score) {
                p2.won += 1;
                p2.points += 3;
                p1.lost += 1;
              } else {
                p1.drawn += 1;
                p2.drawn += 1;
                p1.points += 1;
                p2.points += 1;
              }
            }
          }
        });

        GROUPS.forEach(g => {
          if (standings[g]) {
            standings[g].forEach(p => { p.diff = p.ptsFor - p.ptsAgainst; });
            standings[g].sort((a, b) => b.points - a.points || b.diff - a.diff || b.ptsFor - a.ptsFor);
          }
        });

        return standings;
      }, [data.groupMatches, data.players]);

      useEffect(() => {
        let updated = false;
        const newKnockoutMatches = [...(data.knockoutMatches || [])];

        GROUPS.forEach((g) => {
          const gMatches = (data.groupMatches || []).filter(m => m.group === g);
          const isFinished = gMatches.length > 0 && gMatches.every(m => m.status === 'completed');
          const groupRank = groupStandings[g];

          if (isFinished && groupRank && groupRank.length >= 2) {
            const top1 = groupRank[0].id;
            const top2 = groupRank[1].id;

            const targetMatchP1 = newKnockoutMatches.find(km => km.p1_source === `${g}1`);
            const targetMatchP2 = newKnockoutMatches.find(km => km.p2_source === `${g}2`);

            if (targetMatchP1 && targetMatchP1.p1_id !== top1) {
              targetMatchP1.p1_id = top1;
              updated = true;
            }
            if (targetMatchP2 && targetMatchP2.p2_id !== top2) {
              targetMatchP2.p2_id = top2;
              updated = true;
            }
          }
        });

        if (updated) {
          saveState({ ...data, knockoutMatches: newKnockoutMatches });
        }
      }, [groupStandings, data.groupMatches]);

      const handleVote = (matchId, target) => {
        if (userVotes[matchId]) {
          showToast("你已经对此场对局做出过预测投选", "info");
          return;
        }

        const currentPred = data.predictions?.[matchId] || { p1Votes: 0, p2Votes: 0 };
        const updatedPred = {
          ...currentPred,
          p1Votes: target === 'p1' ? currentPred.p1Votes + 1 : currentPred.p1Votes,
          p2Votes: target === 'p2' ? currentPred.p2Votes + 1 : currentPred.p2Votes
        };

        saveState({
          ...data,
          predictions: { ...(data.predictions || {}), [matchId]: updatedPred }
        });
        setUserVotes(prev => ({ ...prev, [matchId]: target }));
        showToast("预测投选成功！", "success");
      };

      const advanceWinnerToNextRound = (currentMatch, allMatches) => {
        const roundOrder = ['32_strong', '16_strong', '8_strong', 'semi_final'];
        const currentRoundIdx = roundOrder.indexOf(currentMatch.round);
        
        if (currentRoundIdx !== -1 && currentRoundIdx < roundOrder.length - 1) {
          const matchNum = parseInt(currentMatch.id.split('-')[1]);
          const nextRoundKey = roundOrder[currentRoundIdx + 1];
          const nextMatchNum = Math.ceil(matchNum / 2);
          const nextMatchId = getRoundPrefix(nextRoundKey) + '-' + nextMatchNum.toString().padStart(2, '0');

          const nextMatch = allMatches.find(m => m.id === nextMatchId);
          if (nextMatch) {
            if (matchNum % 2 !== 0) {
              nextMatch.p1_id = currentMatch.winner_id;
            } else {
              nextMatch.p2_id = currentMatch.winner_id;
            }
          }
        } else if (currentMatch.round === 'semi_final') {
          const matchNum = parseInt(currentMatch.id.split('-')[1]);
          const loser_id = currentMatch.winner_id === currentMatch.p1_id ? currentMatch.p2_id : currentMatch.p1_id;

          const finalMatch = allMatches.find(m => m.id === 'RFINAL-01');
          const thirdMatch = allMatches.find(m => m.id === 'R3RD-01');

          if (matchNum === 1) {
            if (finalMatch) finalMatch.p1_id = currentMatch.winner_id;
            if (thirdMatch) thirdMatch.p1_id = loser_id;
          } else {
            if (finalMatch) finalMatch.p2_id = currentMatch.winner_id;
            if (thirdMatch) thirdMatch.p2_id = loser_id;
          }
        }
      };

      const getRoundPrefix = (roundKey) => {
        if (roundKey === '16_strong') return 'R16';
        if (roundKey === '8_strong') return 'R8';
        if (roundKey === 'semi_final') return 'R4';
        return 'R32';
      };

      const handleScoreSubmit = (matchId, payload, pin, isConfirmation = false) => {
        let isGroupMatch = matchId.startsWith('G-');
        const targetMatch = isGroupMatch 
          ? data.groupMatches.find(x => x.id === matchId)
          : data.knockoutMatches.find(x => x.id === matchId);

        if (!targetMatch) return false;

        const p1 = playerMap[targetMatch.p1_id];
        const p2 = playerMap[targetMatch.p2_id];

        let allowed = adminLoggedIn;
        let submitterId = null;

        if (!allowed && pin) {
          if (p1?.pin === pin) { allowed = true; submitterId = p1.id; }
          else if (p2?.pin === pin) { allowed = true; submitterId = p2.id; }
          else if (pin === data.adminPin) { allowed = true; }
        }

        if (!allowed) {
          showToast("PIN 码验证错误，请输入选手个人 4 位 PIN 码", "error");
          return false;
        }

        const shouldDirectFinalize = adminLoggedIn || isConfirmation || (targetMatch.pending_score && targetMatch.pending_score.submitted_by !== submitterId);

        if (isGroupMatch) {
          const updatedMatches = data.groupMatches.map(m => {
            if (m.id === matchId) {
              if (shouldDirectFinalize) {
                return {
                  ...m,
                  p1_score: Number(payload.p1),
                  p2_score: Number(payload.p2),
                  pending_score: null,
                  status: 'completed'
                };
              } else {
                return {
                  ...m,
                  pending_score: { p1: Number(payload.p1), p2: Number(payload.p2), submitted_by: submitterId },
                  status: 'awaiting_confirm'
                };
              }
            }
            return m;
          });
          saveState({ ...data, groupMatches: updatedMatches });
        } else {
          const updatedKnockouts = [...data.knockoutMatches];
          const matchIndex = updatedKnockouts.findIndex(km => km.id === matchId);
          if (matchIndex !== -1) {
            const copy = { ...updatedKnockouts[matchIndex] };
            
            if (!shouldDirectFinalize) {
              copy.pending_score = { ...payload, submitted_by: submitterId };
              copy.status = 'awaiting_confirm';
            } else {
              copy.pending_score = null;
              if (copy.format === 'two_legs') {
                if (payload.leg === 1) {
                  copy.leg1 = { p1: Number(payload.p1), p2: Number(payload.p2), status: 'completed' };
                } else if (payload.leg === 2) {
                  copy.leg2 = { p1: Number(payload.p1), p2: Number(payload.p2), status: 'completed' };
                } else if (payload.leg === 3) {
                  copy.leg3 = { 
                    p1: Number(payload.p1), 
                    p2: Number(payload.p2), 
                    penalty_winner: payload.penaltyWinner || null,
                    status: 'completed' 
                  };
                }

                const agg1 = (copy.leg1.p1 || 0) + (copy.leg2.p1 || 0);
                const agg2 = (copy.leg1.p2 || 0) + (copy.leg2.p2 || 0);

                if (copy.leg1.status === 'completed' && copy.leg2.status === 'completed') {
                  if (agg1 > agg2) {
                    copy.winner_id = copy.p1_id;
                    copy.status = 'completed';
                  } else if (agg2 > agg1) {
                    copy.winner_id = copy.p2_id;
                    copy.status = 'completed';
                  } else {
                    if (copy.leg3.status === 'completed') {
                      if (copy.leg3.p1 > copy.leg3.p2) {
                        copy.winner_id = copy.p1_id;
                        copy.status = 'completed';
                      } else if (copy.leg3.p2 > copy.leg3.p1) {
                        copy.winner_id = copy.p2_id;
                        copy.status = 'completed';
                      } else {
                        if (copy.leg3.penalty_winner === 'p1') {
                          copy.winner_id = copy.p1_id;
                          copy.status = 'completed';
                        } else if (copy.leg3.penalty_winner === 'p2') {
                          copy.winner_id = copy.p2_id;
                          copy.status = 'completed';
                        } else {
                          copy.status = 'needs_decider';
                        }
                      }
                    } else {
                      copy.status = 'needs_decider';
                    }
                  }
                }
              } else if (copy.format === 'bo3' || copy.format === 'bo5') {
                const gameIndex = payload.gameIndex;
                copy.games[gameIndex] = {
                  game: gameIndex + 1,
                  p1: Number(payload.p1),
                  p2: Number(payload.p2),
                  status: 'completed'
                };

                let p1Wins = 0, p2Wins = 0;
                copy.games.forEach(g => {
                  if (g.status === 'completed') {
                    if (g.p1 > g.p2) p1Wins++;
                    else if (g.p2 > g.p1) p2Wins++;
                  }
                });

                const targetWins = copy.format === 'bo3' ? 2 : 3;
                if (p1Wins >= targetWins) {
                  copy.winner_id = copy.p1_id;
                  copy.status = 'completed';
                } else if (p2Wins >= targetWins) {
                  copy.winner_id = copy.p2_id;
                  copy.status = 'completed';
                } else {
                  copy.status = 'in_progress';
                }
              }

              if (copy.winner_id && copy.status === 'completed') {
                advanceWinnerToNextRound(copy, updatedKnockouts);
              }
            }

            updatedKnockouts[matchIndex] = copy;
            saveState({ ...data, knockoutMatches: updatedKnockouts });
          }
        }

        setSelectedMatch(null);
        setModalType(null);

        if (!shouldDirectFinalize) {
          showToast("比分已暂存！已通知对手进行核对确认", "info");
        } else {
          showToast("比分录入并核准成功！", "success");
        }
        return true;

    function KnockoutMatchCard({ match, playerMap, predictions, userVotes, onVote, onSelect, showToast }) {
      const p1 = playerMap[match.p1_id] || { name: match.p1_source ? `小组 ${match.p1_source}` : '待定', team: '' };
      const p2 = playerMap[match.p2_id] || { name: match.p2_source ? `小组 ${match.p2_source}` : '待定', team: '' };
      const isDone = match.status === 'completed';
      const isAwaiting = match.status === 'awaiting_confirm';
      const needsDecider = match.status === 'needs_decider';

      const leg1 = match.leg1 || {};
      const leg2 = match.leg2 || {};
      const leg3 = match.leg3 || {};

      const agg1 = (leg1.p1 || 0) + (leg2.p1 || 0);
      const agg2 = (leg1.p2 || 0) + (leg2.p2 || 0);

      const pred = predictions?.[match.id] || { p1Votes: 0, p2Votes: 0 };
      const totalVotes = pred.p1Votes + pred.p2Votes;
      const p1Pct = totalVotes > 0 ? Math.round((pred.p1Votes / totalVotes) * 100) : 50;
      const p2Pct = totalVotes > 0 ? 100 - p1Pct : 50;
      const userVoteChoice = userVotes[match.id];

      const handleSingleNudge = () => {
        if (!match.p1_id || !match.p2_id) return;
        const text = `@${p1.name}(${p1.team}) @${p2.name}(${p2.team}) ${match.title}淘汰赛请于今晚完成比赛并提交比分！👉比赛链接`;
        copyToClipboard(text, () => showToast(`已复制淘汰赛催赛文本至剪贴板！`, 'success'));
      };

      return (
        <div className={`bg-slate-900 rounded-xl p-3.5 border ${
          needsDecider ? 'border-amber-500 shadow-amber-500/10' :
          isAwaiting ? 'border-amber-500/80 bg-amber-950/10' :
          isDone ? 'border-slate-800' : 'border-slate-800'
        } space-y-2.5`}>
          <div className="flex items-center justify-between">
            <span className="text-[11px] font-bold text-indigo-400 bg-indigo-950/80 px-2 py-0.5 rounded border border-indigo-800/50">
              {match.title}
            </span>
            <div className="flex items-center space-x-1.5">
              {!isDone && match.p1_id && match.p2_id && (
                <button
                  onClick={handleSingleNudge}
                  className="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-300 border border-amber-800 hover:bg-amber-900"
                >
                  📢 催赛
                </button>
              )}
              {isAwaiting ? (
                <span className="text-[10px] font-bold bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30 animate-pulse">
                  ⚠️ 待对手核对确认
                </span>
              ) : needsDecider ? (
                <span className="text-[10px] font-bold bg-amber-500 text-slate-950 px-2 py-0.5 rounded">
                  💥 总进球平局！解锁加赛第3场(含点球)
                </span>
              ) : isDone ? (
                <span className="text-[10px] font-bold bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30">
                  已完赛
                </span>
              ) : (
                <span className="text-[11px] text-slate-400">进行中</span>
              )}
            </div>
          </div>

          <div className="space-y-1.5 bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-xs">
            <div className="flex items-center justify-between">
              <span className={`font-bold truncate ${match.winner_id === match.p1_id ? 'text-amber-400' : 'text-slate-200'}`}>
                {p1.name} <span className="text-[10px] font-normal text-slate-500">({p1.team})</span> {match.winner_id === match.p1_id && '🏆'}
              </span>
              <span className="font-mono font-bold text-indigo-300">
                {match.format === 'two_legs' ? `总进球: ${agg1}` : ''}
              </span>
            </div>
            <div className="flex items-center justify-between">
              <span className={`font-bold truncate ${match.winner_id === match.p2_id ? 'text-amber-400' : 'text-slate-200'}`}>
                {p2.name} <span className="text-[10px] font-normal text-slate-500">({p2.team})</span> {match.winner_id === match.p2_id && '🏆'}
              </span>
              <span className="font-mono font-bold text-indigo-300">
                {match.format === 'two_legs' ? `总进球: ${agg2}` : ''}
              </span>
            </div>
          </div>

          {match.format === 'two_legs' && (
            <div className="grid grid-cols-3 gap-1 text-[10px] text-center text-slate-400 bg-slate-950/50 p-1.5 rounded">
              <div>
                <span className="block text-slate-500">第1回合</span>
                <span className="font-mono font-bold text-slate-300">{leg1.status === 'completed' ? `${leg1.p1}-${leg1.p2}` : '-'}</span>
              </div>
              <div>
                <span className="block text-slate-500">第2回合</span>
                <span className="font-mono font-bold text-slate-300">{leg2.status === 'completed' ? `${leg2.p1}-${leg2.p2}` : '-'}</span>
              </div>
              <div className={needsDecider ? 'text-amber-400 font-bold' : ''}>
                <span className="block text-slate-500">加赛第3场(含点球)</span>
                <span className="font-mono font-bold">
                  {leg3.status === 'completed' 
                    ? `${leg3.p1}-${leg3.p2}` + (leg3.penalty_winner ? ` (点球:${playerMap[leg3.penalty_winner === 'p1' ? match.p1_id : match.p2_id]?.name || ''}胜)` : '')
                    : needsDecider ? '待加赛' : '-'}
                </span>
              </div>
            </div>
          )}

          {match.p1_id && match.p2_id && (
            <div className="bg-slate-950/60 p-2 rounded-lg border border-slate-800/80 space-y-1.5">
              <div className="flex items-center justify-between text-[10px] text-slate-400">
                <span>🗳️ 胜率预测 ({totalVotes}人参与)</span>
                {userVoteChoice && <span className="text-emerald-400 font-bold">已预测</span>}
              </div>
              <div className="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden flex">
                <div style={{ width: `${p1Pct}%` }} className="bg-indigo-500 h-full"></div>
                <div style={{ width: `${p2Pct}%` }} className="bg-amber-500 h-full"></div>
              </div>
              <div className="flex justify-between items-center text-[10px]">
                <button
                  onClick={() => onVote(match.id, 'p1')}
                  disabled={isDone || !!userVoteChoice}
                  className="text-indigo-300 hover:underline"
                >
                  支持 {p1.name} ({p1Pct}%)
                </button>
                <button
                  onClick={() => onVote(match.id, 'p2')}
                  disabled={isDone || !!userVoteChoice}
                  className="text-amber-300 hover:underline"
                >
                  支持 {p2.name} ({p2Pct}%)
                </button>
              </div>
            </div>
          )}

          <button
            onClick={() => onSelect(match)}
            disabled={!match.p1_id || !match.p2_id}
            className={`w-full py-1.5 rounded-lg text-xs font-bold text-white transition ${
              isAwaiting ? 'bg-amber-600 hover:bg-amber-500 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-500'
            }`}
          >
            {isAwaiting ? '核对并确认比分' : '录入 / 更新比分'}
          </button>
        </div>
      );
    }

            </div>

            {isAwaitingConfirm && (
              <div className="bg-amber-950/50 border border-amber-500/50 p-2.5 rounded-lg text-xs space-y-1">

                <p className="text-slate-300 text-[11px]">
                  {submitterName ? `[${submitterName}]` : '对手'} 已暂存比分：<strong className="text-amber-400">{p1.name} {match.pending_score?.p1} - {match.pending_score?.p2} {p2.name}</strong>。
                  请核对无误后输入你的 PIN 码点击“确认比分”，或直接修改重新提交。
                </p>
              </div>
            )}

            {!isGroup && match.format === 'two_legs' && (
              <div className="grid grid-cols-3 gap-1.5">
                {[1, 2, 3].map(leg => (
                  <button
                    key={leg}
                    onClick={() => setLegTarget(leg)}
                    className={`py-1 rounded text-xs font-bold ${legTarget === leg ? 'bg-indigo-600 text-white' : 'bg-slate-950 text-slate-400'}`}
                  >
                    {leg === 3 ? '加赛第3场' : `第 ${leg} 回合`}
                  </button>
                ))}
              </div>
            )}

            <div className="grid grid-cols-2 gap-3 bg-slate-950 p-3 rounded-lg border border-slate-800">
              <div className="text-center space-y-1">
                <span className="block font-bold text-xs text-white truncate">{p1.name}</span>
                <input
                  type="number"
                  value={p1Score}
                  onChange={e => setP1Score(e.target.value)}
                  placeholder="进球"
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg py-1.5 text-center text-lg font-bold font-mono text-amber-400 focus:outline-none"
                />
              </div>
              <div className="text-center space-y-1">
                <span className="block font-bold text-xs text-white truncate">{p2.name}</span>
                <input
                  type="number"
                  value={p2Score}
                  onChange={e => setP2Score(e.target.value)}
                  placeholder="进球"
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg py-1.5 text-center text-lg font-bold font-mono text-amber-400 focus:outline-none"
                />
              </div>
            </div>

            {!adminLoggedIn && (
              <div>
                <input
                  type="password"
                  maxLength={4}
                  value={pin}
                  onChange={e => setPin(e.target.value)}
                  placeholder="输入个人 4 位 PIN 码"
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-center font-mono text-xs text-white focus:outline-none"
                />
              </div>
            )}

            <div className="flex space-x-2">
              {isAwaitingConfirm && (
                <button
                  onClick={() => {
                    if (p1Score === '' || p2Score === '') return;
                    onSubmit(match.id, { p1: p1Score, p2: p2Score, leg: legTarget, gameIndex, penaltyWinner }, pin, true);
                  }}
                  className="flex-1 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white shadow"
                >
                  ✅ 确认核准比分
                </button>
              )}
              <button
                onClick={() => {
                  if (p1Score === '' || p2Score === '') return;
                  onSubmit(match.id, { p1: p1Score, p2: p2Score, leg: legTarget, gameIndex, penaltyWinner }, pin, false);
                }}
                className="flex-1 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-bold text-xs text-white shadow"
              >
                {isAwaitingConfirm ? '修改并重新提交' : '提交比分'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ChampionTreeModal({ data, playerMap, onClose, onExportTree }) {
      const knockouts = data.knockoutMatches || [];
      
      const upperR32 = knockouts.filter(m => m.round === '32_strong' && m.half === 'upper');
      const upperR16 = knockouts.filter(m => m.round === '16_strong' && m.half === 'upper');
      const upperR8 = knockouts.filter(m => m.round === '8_strong' && m.half === 'upper');
      const upperSemi = knockouts.find(m => m.round === 'semi_final' && m.half === 'upper');

      const lowerR32 = knockouts.filter(m => m.round === '32_strong' && m.half === 'lower');
      const lowerR16 = knockouts.filter(m => m.round === '16_strong' && m.half === 'lower');
      const lowerR8 = knockouts.filter(m => m.round === '8_strong' && m.half === 'lower');
      const lowerSemi = knockouts.find(m => m.round === 'semi_final' && m.half === 'lower');

      const finalMatch = knockouts.find(m => m.round === 'final');
      const thirdMatch = knockouts.find(m => m.round === 'third_place');
      const champion = finalMatch?.winner_id ? playerMap[finalMatch.winner_id] : null;

      const renderTreeNode = (m) => {
        if (!m) return <div className="bg-slate-900 border border-slate-800 rounded p-1 text-[10px] w-24 text-slate-600 text-center">待定</div>;
        const p1 = playerMap[m.p1_id] || { name: m.p1_source || '待定', team: '' };
        const p2 = playerMap[m.p2_id] || { name: m.p2_source || '待定', team: '' };

        let p1ScoreDisplay = '-';
        let p2ScoreDisplay = '-';

        if (m.format === 'two_legs') {
          const l1 = m.leg1 || {};
          const l2 = m.leg2 || {};
          if (l1.status === 'completed' || l2.status === 'completed') {
            const agg1 = (l1.p1 || 0) + (l2.p1 || 0);
            const agg2 = (l1.p2 || 0) + (l2.p2 || 0);
            p1ScoreDisplay = agg1;
            p2ScoreDisplay = agg2;
          }
        }

        return (
          <div key={m.id} className="bg-slate-900 border border-slate-750/80 rounded-lg p-1.5 text-[10px] w-28 sm:w-32 space-y-1 shadow-md shrink-0">
            <div className={`flex items-center justify-between font-semibold truncate ${m.winner_id === m.p1_id ? 'text-amber-400 font-bold' : 'text-slate-200'}`}>
              <span className="truncate max-w-[80px]">{p1.name}</span>
              <span className="font-mono bg-slate-950 px-1 rounded text-indigo-300 ml-1">{p1ScoreDisplay}</span>
            </div>
            <div className={`flex items-center justify-between font-semibold truncate ${m.winner_id === m.p2_id ? 'text-amber-400 font-bold' : 'text-slate-200'}`}>
              <span className="truncate max-w-[80px]">{p2.name}</span>
              <span className="font-mono bg-slate-950 px-1 rounded text-indigo-300 ml-1">{p2ScoreDisplay}</span>
            </div>
          </div>
        );
      };

      const TreeConnectorDown = () => (
        <div className="w-full flex flex-col items-center my-0.5">
          <div className="w-1/2 h-2 border-l-2 border-r-2 border-b-2 border-slate-700 rounded-b"></div>
          <div className="w-0.5 h-2 bg-slate-700"></div>
        </div>
      );

      const TreeConnectorUp = () => (
        <div className="w-full flex flex-col items-center my-0.5">
          <div className="w-0.5 h-2 bg-slate-700"></div>
          <div className="w-1/2 h-2 border-l-2 border-r-2 border-t-2 border-slate-700 rounded-t"></div>
        </div>
      );

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md overflow-y-auto p-4 sm:p-6">
          <div className="max-w-6xl w-full mx-auto bg-slate-950 border border-slate-800 rounded-2xl p-4 sm:p-6 space-y-4 my-4 sm:my-8 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <h3 className="font-bold text-white text-base flex items-center space-x-2">
                  <span>🏆 淘汰赛冠军之路对局树状图</span>
                </h3>
                <p className="text-[11px] text-slate-400">上下双区对向汇聚模式 (懂球帝大赛经典战报风格)</p>
              </div>
              <div className="flex space-x-2">
                <button onClick={onExportTree} className="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-bold text-xs text-white shadow">
                  📸 一键导出树状图海报
                </button>
                <button onClick={onClose} className="text-slate-400 font-bold px-2 hover:text-white">✕</button>
              </div>
            </div>

            <div id="champion-tree-content" className="p-4 bg-slate-950 border border-slate-900 rounded-2xl overflow-x-auto custom-scrollbar flex flex-col items-center space-y-6">
              
              {/* TOP HALF (FLOWS DOWNWARDS) */}
              <div className="w-full flex flex-col items-center space-y-3 min-w-[720px]">
                <div className="bg-indigo-950/60 border border-indigo-800/80 px-4 py-1 rounded-full text-xs font-bold text-indigo-300">
                  ⚔️ 上半区 (Upper Half · A - H 组)
                </div>

                <div className="grid grid-cols-8 gap-2 w-full justify-items-center">
                  {upperR32.map(m => renderTreeNode(m))}
                </div>

                <div className="grid grid-cols-4 gap-2 w-full justify-items-center">
                  {Array.from({ length: 4 }).map((_, i) => <TreeConnectorDown key={i} />)}
                </div>

                <div className="grid grid-cols-4 gap-4 w-full justify-items-center">
                  {upperR16.map(m => renderTreeNode(m))}
                </div>

                <div className="grid grid-cols-2 gap-4 w-full justify-items-center">
                  {Array.from({ length: 2 }).map((_, i) => <TreeConnectorDown key={i} />)}
                </div>

                <div className="grid grid-cols-2 gap-8 w-full justify-items-center">
                  {upperR8.map(m => renderTreeNode(m))}
                </div>

                <div className="w-full flex justify-center">
                  <TreeConnectorDown />
                </div>

                <div className="flex justify-center">
                  {renderTreeNode(upperSemi)}
                </div>

                <div className="w-0.5 h-4 bg-indigo-500"></div>
              </div>

              {/* CENTER FINALS AREA */}
              <div className="w-full max-w-lg bg-gradient-to-b from-indigo-950/40 via-amber-950/30 to-indigo-950/40 border border-amber-500/50 p-5 rounded-2xl flex flex-col items-center space-y-3 shadow-2xl text-center">
                <div className="flex items-center space-x-2">
                  <span className="text-xl">🏆</span>
                  <span className="text-sm font-black text-amber-400 uppercase tracking-widest">终极总决赛 (Bo5)</span>
                  <span className="text-xl">🏆</span>
                </div>

                {renderTreeNode(finalMatch)}

                <div className="bg-amber-500 text-slate-950 py-2 px-6 rounded-xl font-black text-xs shadow-xl min-w-[180px]">
                  <span className="block text-[9px] uppercase tracking-wider opacity-80">👑 本期冠军教练</span>
                  <span className="text-base block mt-0.5">{champion ? champion.name : '等待王者降临'}</span>
                  {champion && <span className="text-[10px] font-normal block opacity-90">({champion.team})</span>}
                </div>

                <div className="pt-2 border-t border-slate-800/80 w-full flex flex-col items-center space-y-1">
                  <span className="text-[11px] font-bold text-slate-400">🥉 季军争夺战 (Bo3)</span>
                  {renderTreeNode(thirdMatch)}
                </div>
              </div>

              {/* BOTTOM HALF (FLOWS UPWARDS) */}
              <div className="w-full flex flex-col items-center space-y-3 min-w-[720px]">
                <div className="w-0.5 h-4 bg-indigo-500"></div>

                <div className="flex justify-center">
                  {renderTreeNode(lowerSemi)}
                </div>

                <div className="w-full flex justify-center">
                  <TreeConnectorUp />
                </div>

                <div className="grid grid-cols-2 gap-8 w-full justify-items-center">
                  {lowerR8.map(m => renderTreeNode(m))}
                </div>

                <div className="grid grid-cols-2 gap-4 w-full justify-items-center">
                  {Array.from({ length: 2 }).map((_, i) => <TreeConnectorUp key={i} />)}
                </div>

                <div className="grid grid-cols-4 gap-4 w-full justify-items-center">
                  {lowerR16.map(m => renderTreeNode(m))}
                </div>

                <div className="grid grid-cols-4 gap-2 w-full justify-items-center">
                  {Array.from({ length: 4 }).map((_, i) => <TreeConnectorUp key={i} />)}
                </div>

                <div className="grid grid-cols-8 gap-2 w-full justify-items-center">
                  {lowerR32.map(m => renderTreeNode(m))}
                </div>

                <div className="bg-indigo-950/60 border border-indigo-800/80 px-4 py-1 rounded-full text-xs font-bold text-indigo-300">
                  ⚔️ 下半区 (Lower Half · I - P 组)
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    function PosterContainer({ id, data, groupStandings, playerMap }) {
      return (
        <div id={id} className="w-[600px] bg-slate-950 p-8 space-y-6 text-slate-100 border border-slate-800">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h1 className="text-xl font-black text-amber-400">{data.title}</h1>
              <p className="text-xs text-slate-400">微信群官方战报 · 实时更新榜单</p>
            </div>
            <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-xl">🏆</div>
          </div>

          <div className="space-y-3">
            <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider">📊 各小组出线态势</h3>
            <div className="grid grid-cols-4 gap-2">
              {GROUPS.map(g => {
                const rank = groupStandings[g] || [];
                return (
                  <div key={g} className="bg-slate-900 p-2 rounded-lg border border-slate-800 text-[11px]">
                    <span className="font-bold text-amber-400 block mb-0.5">{g} 组</span>
                    <div className="text-[10px] space-y-0.5">
                      <div className="truncate text-slate-200">1. {rank[0]?.name || '-'} ({rank[0]?.points || 0}分)</div>
                      <div className="truncate text-slate-400">2. {rank[1]?.name || '-'} ({rank[1]?.points || 0}分)</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="text-center border-t border-slate-800 pt-4 text-[10px] text-slate-500">
            生成时间: {new Date().toLocaleString('zh-CN')} · 微信群比赛管理系统
          </div>
        </div>
      );
    }

    function ShareModal({ imageUrl, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 space-y-4 text-center">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-white text-base">📱 战报长图生成成功</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>

            <div className="bg-amber-950/60 border border-amber-500/50 p-2.5 rounded-xl text-xs text-amber-200 flex items-center justify-center space-x-1.5">
              <span>💡 提示：长按上方战报图可直接【发送给微信好友】或【保存到相册】</span>
            </div>

            <div className="max-h-[55vh] overflow-y-auto rounded-xl border border-slate-800">
              <img src={imageUrl} alt="微信战报长图" className="w-full h-auto" />
            </div>
            <a
              href={imageUrl}
              download="DLS微信群比赛战报.png"
              className="block w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white"
            >
              下载战报图片
            </a>
          </div>
        </div>
      );
    }

    function AdminLoginModal({ adminPin, adminLoggedIn, onLogin, onLogout, onClose }) {
      const [pin, setPin] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-6 space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-white text-base">⚙️ 管理员认证</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>
            {adminLoggedIn ? (
              <div className="space-y-4 text-center">
                <p className="text-xs text-emerald-400 font-bold">✓ 已成功登录管理员身份</p>
                <button onClick={onLogout} className="w-full py-2 rounded-xl bg-red-600 text-xs font-bold text-white">
                  退出登录
                </button>
              </div>
            ) : (
              <div className="space-y-4">
                <input
                  type="password"
                  value={pin}
                  onChange={e => { setPin(e.target.value); setErrorMsg(''); }}
                  placeholder="输入管理员密码"
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-center font-mono text-sm text-white focus:outline-none focus:border-indigo-500"
                  onKeyDown={e => {
                    if (e.key === 'Enter') {
                      if (pin === adminPin) onLogin();
                      else setErrorMsg('密码错误，请重新输入！');
                    }
                  }}
                />
                {errorMsg && <p className="text-xs text-red-400 font-bold text-center">{errorMsg}</p>}
                <button
                  onClick={() => {
                    if (pin === adminPin) onLogin();
                    else setErrorMsg('密码错误，请重新输入！');
                  }}
                  className="w-full py-2.5 rounded-xl bg-indigo-600 font-bold text-xs text-white"
                >
                  确认登录
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
